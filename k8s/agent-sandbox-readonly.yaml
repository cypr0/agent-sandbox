---
# Read-only access for the agent sandbox - best added to the cluster repo via
# GitOps (e.g. kubernetes/apps/agent-sandbox/), ideally as the first ticket for
# the agents themselves. Then run scripts/k8s-readonly-access.sh on the host.
#
# Permissions: built-in ClusterRole "view" (get/list/watch on namespaced objects,
# NO secrets) + read nodes/namespaces/CRDs/StorageClasses. Nothing can be written.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-sandbox
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sandbox-reader
  namespace: agent-sandbox
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-sandbox-reader-view
subjects:
  - kind: ServiceAccount
    name: agent-sandbox-reader
    namespace: agent-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-sandbox-reader-cluster
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-sandbox-reader-cluster
subjects:
  - kind: ServiceAccount
    name: agent-sandbox-reader
    namespace: agent-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-sandbox-reader-cluster
